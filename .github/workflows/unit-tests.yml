name: Unit Tests

on:
  push:
    branches: [ main, develop, "feature/**", "feat/**", "bugfix/**", "bug/**" ]
    paths:
      - 'backend/src/**'
      - 'backend/__tests__/**'
      - 'backend/jest.config.js'
      - 'backend/package.json'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/src/**'
      - 'backend/__tests__/**'
      - 'backend/jest.config.js'
      - 'backend/package.json'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    name: Backend Unit Tests (Jest)

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: backend
        run: npm install

      - name: Create .env for Testing
        working-directory: backend
        run: |
          echo "NODE_ENV=test" > .env
          echo "REDIS_HOST=localhost" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "LOG_LEVEL=error" >> .env
          echo "JWT_SECRET=test-secret-key-for-testing" >> .env
          echo "DATABASE_URL=mysql://root:root_password@localhost:3306/publicast_test" >> .env
          echo "ACCESS_TOKEN_SECRET=test-access-token-secret-at-least-32-chars-long" >> .env
          echo "REFRESH_TOKEN_SECRET=test-refresh-token-secret-at-least-32-chars-long" >> .env
          echo "ENCRYPTION_KEY=test-encryption-key-at-least-32-characters" >> .env
          echo "CLOUDINARY_CLOUD_NAME=test-cloud" >> .env
          echo "CLOUDINARY_API_KEY=test-key" >> .env
          echo "CLOUDINARY_API_SECRET=test-secret" >> .env

      - name: Run Unit Tests (Full Suite)
        working-directory: backend
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
        # These specs hit a real MySQL instance (no Prisma mock) and are
        # covered instead by selenium.yml, which runs a MySQL service
        # container end-to-end. This job only provisions Redis.
        run: |
          npm run test -- --coverage --passWithNoTests --maxWorkers=2 \
            --testPathIgnorePatterns="/node_modules/" \
            --testPathIgnorePatterns="tests/auth/login.integration.test.js" \
            --testPathIgnorePatterns="tests/auth/two-factor.integration.test.js" \
            --testPathIgnorePatterns="tests/auth/google-linking.integration.test.js" \
            --testPathIgnorePatterns="tests/smart-link/smart-link.test.js" \
            --testPathIgnorePatterns="tests/smart-link/smart-link.routes.integration.test.js" \
            --testPathIgnorePatterns="tests/smart-link/internal-smart-link-db.test.js" \
            --testPathIgnorePatterns="tests/socket/socket-chat.test.js" \
            --testPathIgnorePatterns="tests/pricing_revenue/user.admin.test.js" \
            --testPathIgnorePatterns="tests/pricing_revenue/product.api.test.js" \
            --testPathIgnorePatterns="tests/social/bluesky-sync-metrics.test.js" \
            --testPathIgnorePatterns="tests/social/bluesky-comment.test.js"

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./backend/coverage/lcov.info
        continue-on-error: true

      - name: Test Summary
        if: always()
        run: |
          if [ -f "backend/coverage/coverage-summary.json" ]; then
            echo "📊 Coverage Summary:"
            cat backend/coverage/coverage-summary.json | python3 -m json.tool || true
          fi

  test-distributed-lock:
    runs-on: ubuntu-latest
    name: Distributed Lock Service Tests

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: backend
        run: npm install

      - name: Create .env for Testing
        working-directory: backend
        run: |
          echo "NODE_ENV=test" > .env
          echo "REDIS_HOST=localhost" >> .env
          echo "REDIS_PORT=6379" >> .env

      - name: Run Distributed Lock Tests
        working-directory: backend
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
        run: |
          npm run test -- tests/services/distributed-lock.service.test.js --verbose

  test-quota-tracker:
    runs-on: ubuntu-latest
    name: Quota Tracker Service Tests

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: backend
        run: npm install

      - name: Create .env for Testing
        working-directory: backend
        run: |
          echo "NODE_ENV=test" > .env
          echo "REDIS_HOST=localhost" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "TZ=America/Los_Angeles" >> .env

      - name: Run Quota Tracker Tests
        working-directory: backend
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
        run: |
          npm run test -- tests/services/quota-tracker.service.test.js --verbose

  report:
    runs-on: ubuntu-latest
    name: Test Report
    needs: [test-backend, test-distributed-lock, test-quota-tracker]
    if: always()

    steps:
      - name: Test Summary
        run: |
          echo "📋 Test Results:"
          echo "  Backend Tests: ${{ needs.test-backend.result }}"
          echo "  Distributed Lock Tests: ${{ needs.test-distributed-lock.result }}"
          echo "  Quota Tracker Tests: ${{ needs.test-quota-tracker.result }}"

          if [ "${{ needs.test-backend.result }}" = "failure" ] || [ "${{ needs.test-distributed-lock.result }}" = "failure" ] || [ "${{ needs.test-quota-tracker.result }}" = "failure" ]; then
            echo "❌ Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed"
