name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - preview

jobs:
  check-status:
    runs-on: ubuntu-latest
    name: Check CI Status
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if all tests passed
        run: |
          echo "✅ All CI checks must pass before deploying"
          echo "Current branch: ${{ github.ref_name }}"

  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to ${{ inputs.environment || 'staging' }}
    needs: check-status

    environment:
      name: staging
      url: https://staging.publicast.app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
        continue-on-error: true

      - name: Build Backend
        working-directory: backend
        run: |
          npm install
          npm run build || echo "No build script"

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          VITE_API_BASE_URL=https://staging-api.publicast.app npm run build

      - name: Deploy Backend to Staging
        working-directory: backend
        env:
          DEPLOY_ENV: staging
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
        run: |
          echo "📦 Deploying backend to staging..."
          # Create SSH key file
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key

          # Add host to known hosts
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          # Deploy command
          ssh -i ~/.ssh/staging_key $DEPLOY_USER@$DEPLOY_HOST << 'DEPLOY'
            cd /app/publicast
            git fetch origin
            git checkout develop
            git pull origin develop
            npm install
            npx prisma db push
            npm restart || npm start
          DEPLOY

      - name: Deploy Frontend to Staging
        working-directory: frontend
        env:
          DEPLOY_ENV: staging
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
        run: |
          echo "🚀 Deploying frontend to staging..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key

          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/staging_key $DEPLOY_USER@$DEPLOY_HOST << 'DEPLOY'
            cd /app/publicast/frontend
            npm install
            npm run build
            # Copy to web root
            sudo cp -r dist/* /var/www/html/staging/
          DEPLOY

      - name: Run Smoke Tests
        working-directory: test_selenium
        env:
          BASE_URL: https://staging.publicast.app
          API_URL: https://staging-api.publicast.app
        run: |
          npm install
          npm run test:brand || echo "Smoke tests can fail without blocking deploy"
        continue-on-error: true

      - name: Verify Deployment
        env:
          STAGING_URL: https://staging.publicast.app
        run: |
          echo "🔍 Verifying deployment..."

          # Health check
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $STAGING_URL/health || echo "000")
            if [ $STATUS -eq 200 ]; then
              echo "✅ Health check passed"
              break
            fi
            echo "⏳ Health check attempt $i (Status: $STATUS)..."
            sleep 10
          done

          if [ $STATUS -ne 200 ]; then
            echo "❌ Health check failed after 10 attempts"
            exit 1
          fi

      - name: Post Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful!"
            echo "🔗 Staging URL: https://staging.publicast.app"
            echo "📊 Monitor: https://monitoring.publicast.app/staging"
          else
            echo "❌ Deployment failed!"
            echo "📋 Check logs for details"
          fi

  notify-slack:
    runs-on: ubuntu-latest
    name: Notify Slack
    needs: deploy-staging
    if: always()

    steps:
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "Staging Deployment ${{ needs.deploy-staging.result == 'success' && '✅ Success' || '❌ Failed' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Staging Deployment ${{ needs.deploy-staging.result == 'success' && '✅' || '❌' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ needs.deploy-staging.result }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Logs"
                      },
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Staging App"
                      },
                      "url": "https://staging.publicast.app"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true
